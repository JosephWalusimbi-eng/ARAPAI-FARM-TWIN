# Keeps the free Render service awake during NASA Space Apps judging (14-17 Nov 2026).
# Render's free plan sleeps after about 15 minutes without visitors, and the first visit then
# takes about a minute. This pings the health endpoint every 5 minutes (GitHub's shortest interval).
# It only calls our own public health URL. Turn it off after the event: GitHub > Actions >
# "Keep site awake" > ... menu > Disable workflow (private-repo Actions minutes are limited).
name: Keep site awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        run: |
          # Stop quietly after the event so the schedule does no work.
          if [ "$(date -u +%Y%m%d)" -gt 20261117 ]; then echo "Event is over; nothing to do."; exit 0; fi
          curl -fsS --retry 3 --retry-delay 10 --max-time 90 https://farm-twin-5n9n.onrender.com/api/health
